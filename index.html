<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Statistical Report</title>
    <style>
        /* Pleasant, modern styling */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --background-color: #f4f7f6;
            --surface-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Logo and Header Styling */
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Key Outcomes Grid */
        .outcomes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .outcome-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .outcome-card h3 {
            color: var(--accent-color);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        section {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        section:last-child {
            border-bottom: none;
        }

        h1 { color: var(--primary-color); font-size: 2.2rem; border-bottom: 3px solid var(--accent-color); display: inline-block; padding-bottom: 5px; }
        h2 { color: var(--secondary-color); font-size: 1.6rem; margin-top: 30px; }
        h3, h4, h5 { color: var(--primary-color); }
        
        .table-wrapper { margin: 20px 0 30px 0; overflow-x: auto; }

        .dynamic-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background-color: #fff;
        }
        .dynamic-data-table th, .dynamic-data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .dynamic-data-table th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
        }
        .dynamic-data-table tbody tr:nth-child(even) { background-color: #f9fbfd; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-section">
            <div id="logo_header"></div>
            <h1 id="report_title">Loading Report...</h1>
            <p id="tagline" style="font-style: italic; color: #7f8c8d; font-size: 1.2rem;"></p>
            <p id="we_have_supported"></p>
            <h1 id="number_of_individuals_supported" style="border: none; font-size: 3rem; margin: 10px 0;"></h1>
            <p id="on_their_growth"></p>
        </div>

        <section>
            <h2>Key Outcomes</h2>
            <div class="outcomes-grid">
                <div class="outcome-card">
                    <h3 id="number_of_one"></h3>
                    <p id="key_outcome_1"></p>
                </div>
                <div class="outcome-card">
                    <h3 id="number_of_two"></h3>
                    <p id="key_outcome_2"></p>
                </div>
                <div class="outcome-card">
                    <h3 id="number_of_three"></h3>
                    <p id="key_outcome_3"></p>
                </div>
                <div class="outcome-card">
                    <h3 id="number_of_four"></h3>
                    <p id="key_outcome_4"></p>
                </div>
            </div>
        </section>

        <section>
            <h2 id="new_connections_header"></h2>
            <h1 id="number_of_new_enrollments_from_outside_tasks" style="border: none; margin-bottom: 0;"></h1>
            <h4 id="new_enrollments_text_1" style="margin-top: 5px;"></h4>
            <h5 id="new_enrollments_text_2"></h5>

            <h4 id="enrollment_by_county_header"></h4>
            <ul id="number_of_enrollments_by_county"></ul>
            <div id="enrollment_by_county_table" class="table-wrapper"></div>

            <h4 id="top_programs_enrolled_header"></h4>
            <ul id="number_of_enrollments"></ul>
            <div id="number_of_enrollments_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2>Who We Served</h2>
            
            <h4 id="gender"></h4>
            <ul id="gender_number"></ul>
            <div id="gender_table" class="table-wrapper"></div>

            <h4 id="age"></h4>
            <ul id="age_info"></ul>
            <div id="age_table" class="table-wrapper"></div>

            <h4 id="education"></h4>
            <ul id="education_number"></ul>
            <div id="education_table" class="table-wrapper"></div>

            <h4 id="primary"></h4>
            <ul id="primary_info"></ul>
            <div id="primary_table" class="table-wrapper"></div>

            <h4 id="race"></h4>
            <ul id="race_number"></ul>
            <div id="race_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="general_client_characteristics"></h2>
            <h3 id="all_programs"></h3>
            <p id="in_year_tasks_unlimited_provided_p"></p>
            
            <div id="genderall_participants_n_number_percent_table" class="table-wrapper"></div>
            <div id="race_all_participants_n_number_percent_table" class="table-wrapper"></div>
            <div id="education_levelall_except_nooc_placement_table" class="table-wrapper"></div>
            <p id="some_of_the_client_data_p" style="font-style: italic; font-size: 0.85rem;"></p>
            
            <div id="age_as_of_all_except_table" class="table-wrapper"></div>

            <h3 id="mental_health_program_participants_h2"></h3>
            <div id="primary_diagnosesadults_number_percent_table" class="table-wrapper"></div>
        </section>

        <section>
            <h4 id="client_satisfaction_header"></h4>
            <a id="client_satisfaction_data_link" target="_blank" style="color: var(--accent-color); font-weight: bold;">View Client Satisfaction Data</a>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
