<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Statistical Report</title>
    <style>
        /* Pleasant, modern styling for testing */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --background-color: #f4f7f6;
            --surface-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        section {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 15px;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        h2 {
            color: var(--secondary-color);
            font-size: 1.5rem;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .footnote {
            font-size: 0.85rem;
            color: #7f8c8d;
            font-style: italic;
            margin-top: -10px;
        }

        /* * Styling for the tables generated by script.js 
         * script.js applies the 'dynamic-data-table' class automatically
         */
        .table-wrapper {
            margin: 20px 0 30px 0;
            overflow-x: auto; /* Keeps tables responsive on mobile */
        }

        .dynamic-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .dynamic-data-table th, 
        .dynamic-data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .dynamic-data-table th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .dynamic-data-table tbody tr:hover {
            background-color: #f9fbfd;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <section>
            <h1 id="general_client_characteristics_header">Loading Report Data...</h1>
            <h2 id="all_programs_header"></h2>
            <p id="total_unduplicated_individuals"></p>
            <p id="participated_programs_list"></p>
            
            <div id="gender_all_participants_table" class="table-wrapper"></div>
            <div id="education_level_table" class="table-wrapper"></div>
            <p id="education_level_footnote" class="footnote"></p>
            
            <div id="age_distribution_table" class="table-wrapper"></div>
            <div id="race_all_participants_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="mental_health_participants_header"></h2>
            <div id="primary_diagnoses_adults_table" class="table-wrapper"></div>
            <p id="primary_diagnoses_footnote" class="footnote"></p>
        </section>

        <section>
            <h2 id="tutc_header"></h2>
            <p id="tutc_description"></p>
            <p id="tutc_enrollment_stats"></p>
            
            <div id="tutc_chemical_use_table" class="table-wrapper"></div>
            <div id="tutc_primary_diagnoses_table" class="table-wrapper"></div>
            <div id="tutc_gender_table" class="table-wrapper"></div>
            <div id="tutc_age_table" class="table-wrapper"></div>
            <div id="tutc_race_table" class="table-wrapper"></div>
            <div id="tutc_education_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="jtp_header"></h2>
            <p id="jtp_description"></p>
            <p id="jtp_tracks_info"></p>
            <p id="jtp_enrollment_stats"></p>
            
            <div id="jtp_primary_diagnoses_table" class="table-wrapper"></div>
            <div id="jtp_gender_table" class="table-wrapper"></div>
            <div id="jtp_age_table" class="table-wrapper"></div>
            <div id="jtp_race_table" class="table-wrapper"></div>
            <div id="jtp_education_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="lodge_and_job_programs_header"></h2>
            <p id="lodge_and_job_description"></p>
            <p id="lodge_and_job_enrollment"></p>
            
            <div id="lodge_job_diagnoses_table" class="table-wrapper"></div>
            <div id="lodge_job_gender_table" class="table-wrapper"></div>
            <div id="lodge_job_age_table" class="table-wrapper"></div>
            <div id="lodge_job_race_table" class="table-wrapper"></div>
            <div id="lodge_job_education_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="transition_lodge_header"></h2>
            <p id="transition_lodge_description"></p>
            <p id="transition_lodge_model"></p>
            <p id="transition_lodge_enrollment"></p>
            
            <div id="transition_lodge_diagnoses_table" class="table-wrapper"></div>
            <div id="transition_lodge_gender_table" class="table-wrapper"></div>
            <div id="transition_lodge_age_table" class="table-wrapper"></div>
            <div id="transition_lodge_race_table" class="table-wrapper"></div>
            <div id="transition_lodge_education_table" class="table-wrapper"></div>
        </section>

        <section>
            <h2 id="csp_header"></h2>
            <p id="csp_description_one"></p>
            <p id="csp_description_two"></p>
            <p id="csp_description_three"></p>
            <p id="csp_enrollment"></p>
            
            <div id="csp_diagnoses_table" class="table-wrapper"></div>
            <div id="csp_gender_table" class="table-wrapper"></div>
            <div id="csp_age_table" class="table-wrapper"></div>
            <div id="csp_race_table" class="table-wrapper"></div>
            <div id="csp_education_table" class="table-wrapper"></div>
        </section>

        <section>
            <h1 id="lodge_program_data_header"></h1>
            <p id="lodge_program_description"></p>
            <p id="lodge_daily_census"></p>
            
            <h2 id="lodge_activity_header"></h2>
            <div id="lodge_activity_table" class="table-wrapper"></div>
            <p id="lodge_activity_footnote" class="footnote"></p>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
