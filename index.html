<style>
 :root {
 --navy: #244876;
 --navy-light: #2e5a8f;
 --orange: #e96626;
 --orange-light: #f4955e;
 --teal: #359fa5;
 --teal-light: #5bbcc2;
 --teal-soft: #e8f5f6;
 --white: #ffffff;
 --cream: #faf9f7;
 --warm-gray: #4a5568;
 --mid-gray: #718096;
 --light-gray: #e2e8f0;
 --softest-gray: #f7f8fa;
 --card-shadow: 0 4px 24px rgba(36,72,118,0.07), 0 1.5px 6px rgba(36,72,118,0.04);
 --card-shadow-hover: 0 8px 40px rgba(36,72,118,0.12), 0 2px 10px rgba(36,72,118,0.06);
 --radius: 20px;
 --topnav-height: 56px;
 --sticky-gap: 10px;
 --sticky-offset: calc(var(--topnav-height) + var(--sticky-gap));
 }
 * { margin: 0; padding: 0; box-sizing: border-box; }
 
 html { scroll-behavior: smooth; }
 [id] { scroll-margin-top: calc(var(--sticky-offset, 60px) + 24px); }
 
 body {
 font-family: 'Open Sans', sans-serif;
 background: var(--cream);
 color: var(--warm-gray);
 line-height: 1.6;
 -webkit-font-smoothing: antialiased;
 }
 h1, h2, h3, h4, h5 { font-family: 'Montserrat', sans-serif; color: var(--navy); line-height: 1.25; }
 ul { margin-left: 20px; margin-bottom: 15px; }
 p { margin-bottom: 15px; }

 /* ─── ANIMATIONS ─── */
 @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
 @keyframes countPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
 .animate-in { opacity: 0; }
 .animate-in.is-visible { animation: fadeInUp 0.7s ease-out both; }
 .delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; }
 .delay-3 { animation-delay: 0.3s; } .delay-4 { animation-delay: 0.4s; }
 .delay-5 { animation-delay: 0.5s; } .delay-6 { animation-delay: 0.6s; }

 /* ─── LAYOUT ─── */
 .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

 /* ─── NAV ─── */
 .top-nav { position: sticky; top: 0; z-index: 50; background: rgb(255, 255, 255); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255); }
 .top-nav-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
 .top-nav-brand { font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 1px; font-size: 12px; color: var(--navy); text-transform: uppercase; opacity: 0.9; }
 .top-nav-links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
 .top-nav a { text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; color: var(--navy); padding: 6px 12px; border-radius: 999px; transition: transform 0.2s ease; border: 1px solid transparent; }
 .top-nav a:hover { transform: translateY(-1px); opacity: 0.9; }

 /* ─── HERO ─── */
 .hero { background: linear-gradient(135deg, var(--navy) 0%, #1a3a5c 40%, var(--teal) 100%); padding: 56px 24px 48px; text-align: center; position: relative; overflow: hidden; width: 100vw; margin-left: calc(50% - 50vw); border-radius: 0; }
 .hero-inner { position: relative; z-index: 1; }
 .hero-logo { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 6px; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-bottom: 8px; }
 .hero-subtitle { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 22px; color: var(--white); opacity: 0.92; margin-bottom: 28px; }
 .hero-number { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 96px; color: var(--white); line-height: 1; margin-bottom: 8px; text-shadow: 0 4px 30px rgba(255, 255, 255, 0.4); animation: countPulse 3s ease-in-out infinite; }
 .hero-label { font-family: 'Open Sans', sans-serif; font-weight: 400; font-size: 17px; color: rgba(255,255,255,0.85); max-width: 480px; margin: 0 auto; line-height: 1.5; }

 /* ─── SECTIONS & CARDS ─── */
 .section-stripe { width: 100vw; margin-left: calc(50% - 50vw); padding: 40px 0 60px; margin-top: -20px; }
 .section-header { display: flex; align-items: center; gap: 14px; margin: 48px 0 28px; }
 .section-header h2 { font-size: 20px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
 .section-shell { padding: 0 0 22px; }
 
 .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 28px; margin-bottom: 20px; transition: box-shadow 0.3s ease, transform 0.3s ease; }
 .card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-3px); }
 .card-title { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 2px solid var(--softest-gray); padding-bottom: 8px; }
 .card-note { font-size: 12px; color: var(--mid-gray); margin-bottom: 16px; }

 .demo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
 .demo-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
 .outcome-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }

 /* ─── DONUT CHART & LEGEND UI ─── */
 .chart-container { position: relative; margin: 0 auto; }
 .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; justify-content: center; }
 .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm-gray); }
 .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

 /* ─── NEW CONNECTIONS & BAR CHARTS CUSTOM UI ─── */
 .admit-hero-card { background: linear-gradient(135deg, var(--orange), #d4551b); border-radius: var(--radius); padding: 32px 24px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 6px 30px rgba(233,102,38,0.25); transition: transform 0.3s ease; }
 .admit-hero-card:hover { transform: translateY(-3px); }
 .admit-hero-num { font-family: 'Montserrat', sans-serif; font-weight: 900; line-height: 1; }
 .admit-hero-label { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 8px; line-height: 1.5; font-weight: bold; }

 .bar-row { display: flex; align-items: center; margin-bottom: 10px; }
 .bar-label { width: 150px; font-size: 12.5px; color: var(--navy); flex-shrink: 0; text-align: right; padding-right: 14px; font-weight: 500; }
 .bar-track { flex: 1; height: 22px; background: var(--navy); border-radius: 12px; overflow: hidden; position: relative; }
 .bar-fill { height: 100%; border-radius: 12px; display: flex; align-items: center; }
 .bar-value { font-size: 12px; font-weight: 700; font-family: 'Montserrat', sans-serif; }

 .prog-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--softest-gray); }
 .prog-row:last-child { border-bottom: none; }
 .prog-name { font-size: 13px; color: var(--warm-gray); }
 .prog-num { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; color: var(--navy); background: var(--softest-gray); border-radius: 8px; padding: 3px 12px; }

 /* ─── OUTCOME CARDS ─── */
 .outcome-card { border-radius: var(--radius); padding: 28px 20px; text-align: center; transition: transform 0.3s ease, box-shadow 0.3s ease; position: relative; overflow: hidden; }
 .outcome-card:hover { transform: translateY(-4px); }
 .outcome-num { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 36px; color: var(--white); line-height: 1.1; position: relative; }
 .outcome-label { font-size: 12.5px; color: rgba(255,255,255,0.9); margin-top: 8px; line-height: 1.45; position: relative; }

 /* ─── TABLES ─── */
 .glossary-table-wrap { background: var(--white); border-radius: var(--radius-sm); border: 1px solid var(--border-color); overflow-x: auto; margin-top: 10px; }
 table.glossary-table { width: 100%; border-collapse: collapse; font-size: 12.5px; color: var(--warm-gray); }
 table.glossary-table thead th { font-family: 'Montserrat', sans-serif; font-size: 12px; text-transform: uppercase; color: var(--navy); background: var(--softest-gray); border-bottom: 2px solid var(--light-gray); padding: 12px; text-align: left; }
 table.glossary-table tbody td { border-bottom: 1px solid var(--light-gray); padding: 10px 12px; }
 table.glossary-table tbody tr:nth-child(even) td { background: var(--cream); }

 /* ─── PRINT MEDIA QUERY ─── */
 @media print {
 * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
 body { background: #ffffff !important; }
 .top-nav { display: none !important; }
 .container { max-width: none; margin: 0; padding: 0; }
 .hero { padding: 32px 24px; width: 100% !important; margin: 0 0 24px 0 !important; border-radius: 24px !important; }
 .section-stripe { border-radius: 24px !important; padding: 17px 16px !important; margin-bottom: 24px !important; width: auto !important; margin-left: 0 !important; }
 .card, .admit-hero-card, .outcome-card { break-inside: avoid; page-break-inside: avoid; }
 .outcome-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
 }

 @media (max-width: 900px) {
 .demo-grid, .demo-grid-2 { grid-template-columns: 1fr; }
 .outcome-grid { grid-template-columns: 1fr 1fr; }
 .hero-number { font-size: 64px; }
 .section-stripe { width: auto; margin-left: 0; padding: 20px 0; background: transparent !important; }
 }
 @media (max-width: 600px) { .outcome-grid { grid-template-columns: 1fr; } }
</style>
</head>
