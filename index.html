    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --background-color: #f4f7f6;
            --surface-color: #ffffff;
            --text-color: #333333;
            --border-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: var(--surface-color);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .outcomes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .outcome-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .outcome-card h3 {
            color: var(--accent-color);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        section {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        section:last-child { border-bottom: none; }

        h1 { color: var(--primary-color); font-size: 2.2rem; border-bottom: 3px solid var(--accent-color); display: inline-block; padding-bottom: 5px; }
        h2 { color: var(--secondary-color); font-size: 1.8rem; margin-top: 40px; border-bottom: 2px solid var(--border-color); padding-bottom: 5px;}
        h3 { color: var(--primary-color); font-size: 1.4rem; margin-top: 30px; }
        h4, h5 { color: var(--primary-color); margin-bottom: 5px; }
        
        .table-wrapper { margin: 20px 0 30px 0; overflow-x: auto; }

        .dynamic-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background-color: #fff;
        }
        .dynamic-data-table th, .dynamic-data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .dynamic-data-table th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
        }
        .dynamic-data-table tbody tr:nth-child(even) { background-color: #f9fbfd; }
    </style>
</head>
